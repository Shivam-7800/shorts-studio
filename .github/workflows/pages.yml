name: Update website
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Keep the video previews
        run: |
          mkdir -p docs/previews
          if git ls-remote --exit-code origin previews >/dev/null 2>&1; then
            git fetch -q --depth 1 origin previews
            git archive FETCH_HEAD | tar -x -C docs/previews
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
