name: Make a Short
run-name: "Make: ${{ inputs.topic }} [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What the video is about"
        required: true
        type: string
      language:
        type: choice
        default: hi-IN
        options: [hi-IN, en-IN, ta-IN, te-IN, kn-IN, mr-IN, bn-IN, gu-IN]
      voice:
        type: choice
        default: female
        options: [female, male, mine]
      style:
        description: "Look"
        type: choice
        default: footage
        options: [footage, cartoon, anime]
      script:
        description: "Your own script (leave empty and Gemini writes one)"
        required: false
        type: string
      title:
        description: "Title (leave empty for an AI title)"
        required: false
        type: string
      request_id:
        description: "Used by the control panel. Leave empty."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Only for "My voice": the voice model (~3 GB; the model files are cached between runs)
      - name: Install your-voice model
        if: inputs.voice == 'mine'
        run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Reuse downloaded voice model
        if: inputs.voice == 'mine'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-models-v1
      - name: Build the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_SAMPLE_B64: ${{ secrets.VOICE_SAMPLE_B64 }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          VOICE: ${{ inputs.voice }}
          STYLE: ${{ inputs.style }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
        run: python gh_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: out/
          retention-days: 7
