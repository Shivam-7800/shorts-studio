name: Make a Short
run-name: "Make: ${{ inputs.topic }} [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What the video is about"
        required: true
        type: string
      language:
        type: choice
        default: hi-IN
        options: [hi-IN, en-IN, ta-IN, te-IN, kn-IN, mr-IN, bn-IN, gu-IN]
      voice:
        type: choice
        default: female
        options: [female, male, mine]
      style:
        description: "Look"
        type: choice
        default: footage
        options: [footage, cartoon, anime]
      script:
        description: "Your own script (leave empty and Gemini writes one)"
        required: false
        type: string
      title:
        description: "Title (leave empty for an AI title)"
        required: false
        type: string
      logo:
        description: "Add assets/logo.png to the video"
        type: boolean
        default: true
      upload_id:
        description: "Used by the website for uploaded files. Leave empty."
        required: false
        type: string
      request_id:
        description: "Used by the control panel. Leave empty."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get uploaded files
        if: inputs.upload_id != ''
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
        run: |
          [[ "$UPLOAD_ID" =~ ^[a-z0-9]{6,24}$ ]] || { echo "::error title=Why it stopped::Bad upload id"; exit 1; }
          git fetch -q --depth 1 origin uploads || { echo "::error title=Why it stopped::The uploaded files weren't found. Upload again."; exit 1; }
          mkdir -p in
          git archive FETCH_HEAD "uploads/$UPLOAD_ID" | tar -x -C in --strip-components=2
          ls -la in
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Only for "My voice": the voice model (~3 GB; the model files are cached between runs)
      - name: Install your-voice model
        if: inputs.voice == 'mine'
        run: pip install chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Reuse downloaded voice model
        if: inputs.voice == 'mine'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-models-v1
      - name: Build the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_SAMPLE_B64: ${{ secrets.VOICE_SAMPLE_B64 }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          VOICE: ${{ inputs.voice }}
          STYLE: ${{ inputs.style }}
          SCRIPT: ${{ inputs.script }}
          TITLE: ${{ inputs.title }}
          ADD_LOGO: ${{ inputs.logo }}
        run: python gh_build.py
      - name: Delete uploaded files
        if: always() && inputs.upload_id != ''
        env:
          UPLOAD_ID: ${{ inputs.upload_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin uploads || exit 0
          rm -rf /tmp/u && mkdir -p /tmp/u && git archive FETCH_HEAD | tar -x -C /tmp/u
          rm -rf "/tmp/u/uploads/$UPLOAD_ID"
          cd /tmp/u && git init -q -b uploads && git add -A
          git -c user.name=shorts-studio-bot -c user.email=bot@users.noreply.github.com commit -q --allow-empty -m uploads
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" uploads
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: out/
          retention-days: 7

  # Puts the finished video on your GitHub Pages site so the website can play it
  # in the phone preview. Keeps only the newest 8 videos (one-commit branch, so
  # the repo doesn't grow). Needs Settings → Pages → Source: "GitHub Actions".
  preview:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: short
          path: out
      - name: Save preview
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p prev
          if git ls-remote --exit-code origin previews >/dev/null 2>&1; then
            git fetch -q --depth 1 origin previews
            git archive FETCH_HEAD | tar -x -C prev
          fi
          cp out/short.mp4 "prev/$RUN_ID.mp4"
          cp out/result.json "prev/$RUN_ID.json"
          cd prev
          ls *.mp4 | sort -n | head -n -8 | while read f; do rm -f "$f" "${f%.mp4}.json"; done
          git init -q -b previews
          git add -A
          git -c user.name=shorts-studio-bot -c user.email=bot@users.noreply.github.com commit -qm "previews"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews
          cd ..
          mkdir -p docs/previews
          cp prev/*.mp4 prev/*.json docs/previews/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Put the video on your website
        uses: actions/deploy-pages@v4
